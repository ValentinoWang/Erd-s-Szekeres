name: verify-research-archive

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install small build dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ unzip
      - name: Verify hashes, source bundle, and exact local reconstruction
        run: bash scripts/verify_archive.sh
